<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AILI helper</title>
<style>
  body { margin: 0; width: 320px; font: 13px/1.45 -apple-system, "Segoe UI", system-ui, sans-serif; color: #292524; background: #fff; }
  .wrap { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  h1 { margin: 0; font-size: 15px; display: flex; align-items: center; gap: 8px; }
  .mark { width: 24px; height: 24px; border-radius: 6px; background: #292524; color: #fff; display: inline-flex; align-items: center; justify-content: center; font-weight: 600; font-size: 12px; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 500; }
  input { font: inherit; padding: 7px 9px; border: 1px solid #e7e5e4; border-radius: 6px; }
  input:focus { outline: 2px solid #a8a29e; outline-offset: 1px; }
  .row { display: flex; gap: 8px; }
  button { font: inherit; font-size: 13px; padding: 7px 12px; border-radius: 6px; border: 1px solid #e7e5e4; background: #fff; cursor: pointer; }
  button.primary { background: #292524; color: #fff; border-color: #292524; }
  button:disabled { opacity: 0.5; cursor: default; }
  .status { display: flex; align-items: flex-start; gap: 8px; font-size: 12px; color: #57534e; }
  .dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; flex-shrink: 0; background: #d6d3d1; }
  .dot.ok { background: #10b981; } .dot.warn { background: #f59e0b; } .dot.bad { background: #ef4444; }
  .muted { font-size: 11px; color: #78716c; }
  .err { font-size: 11px; color: #b91c1c; white-space: pre-wrap; }
  .hidden { display: none; }
  .card { border: 1px solid #e7e5e4; border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .who { display: flex; flex-direction: column; gap: 1px; }
  .who strong { font-size: 14px; }
  select { font: inherit; padding: 6px 8px; border: 1px solid #e7e5e4; border-radius: 6px; background: #fff; width: 100%; min-width: 0; }
  .grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
  #add { margin-bottom: 14px; }
  button.wide { width: 100%; }
  a { color: #292524; }
</style>
</head>
<body>
<div class="wrap">
  <h1><span class="mark">A</span> AILI helper</h1>

  <div id="pair">
    <label>AILI address
      <input id="server" type="url" placeholder="http://localhost:3000">
    </label>
    <label style="margin-top:8px">Helper token
      <input id="token" type="text" placeholder="aili_..." autocomplete="off">
    </label>
    <p class="muted">Both are in AILI under Settings.</p>
    <div class="row">
      <button id="connect" class="primary">Connect</button>
    </div>
  </div>

  <div id="paired" class="hidden">
    <div id="add" class="card hidden">
      <div class="who"><span class="muted">On LinkedIn</span><strong id="add-name"></strong></div>
      <div id="add-form">
        <div class="grid">
          <label>Stage <select id="add-stage"></select></label>
          <label>Tag <select id="add-tag"><option value="">No tag</option></select></label>
        </div>
        <button id="add-btn" class="primary wide" style="margin-top:10px">Add to AILI</button>
      </div>
      <p id="add-done" class="muted hidden"></p>
      <p id="add-error" class="err hidden"></p>
    </div>
    <div class="status"><span id="dot" class="dot"></span><span id="line">Checking</span></div>
    <p id="detail" class="muted"></p>
    <p id="error" class="err hidden"></p>
    <div class="row">
      <button id="sync">Sync now</button>
      <button id="disconnect">Disconnect</button>
    </div>
  </div>

  <p class="muted">Every send is your click in AILI. The helper only carries it. Keep LinkedIn logged in in this browser.</p>
</div>
<script src="popup.js" type="module"></script>
</body>
</html>
