<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AILI helper</title>
<style>
  body { margin: 0; width: 320px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif; color: #1c1917; background: #fff; -webkit-font-smoothing: antialiased; }
  .hidden { display: none !important; }
  button { font: inherit; cursor: pointer; border: 0; background: none; color: inherit; }
  button:disabled { opacity: 0.5; cursor: default; }
  :focus-visible { outline: 2px solid #a8a29e; outline-offset: 1px; }

  .top { display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 10px 0 14px; }
  .mark { width: 20px; height: 20px; border-radius: 5px; background: #1c1917; color: #fff; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .brand { font-weight: 600; }
  .actions { margin-left: auto; display: flex; gap: 2px; }
  .icon { width: 28px; height: 28px; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: #57534e; }
  .icon:hover { background: #f0efee; color: #1c1917; }
  .icon.spin svg { animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .body { padding: 6px 20px 18px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; }
  .av { width: 64px; height: 64px; border-radius: 50%; background: #e7e5e4; color: #57534e; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 600; margin: 6px 0 8px; }
  .badge { width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 10px 0 8px; }
  .badge.ok { background: #ecfdf5; color: #059669; }
  .badge.warn { background: #fffbeb; color: #b45309; }
  .name { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; overflow-wrap: anywhere; }
  .sub { font-size: 12.5px; color: #78716c; max-width: 260px; }
  .err { font-size: 12px; color: #b91c1c; margin-top: 6px; }

  .btn { width: 100%; height: 36px; margin-top: 14px; border-radius: 8px; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 13.5px; font-weight: 500; }
  .pri { background: #1c1917; color: #fff; }
  .pri:hover:not(:disabled) { background: #292524; }
  .sec { background: #f0efee; }
  .sec:hover { background: #e7e5e4; }

  .group { width: 100%; margin-top: 14px; border-radius: 10px; background: #f7f6f5; text-align: left; overflow: hidden; }
  .row { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 8px 0 12px; border-top: 1px solid #ecebea; }
  .row:first-child { border-top: 0; }
  .row select { margin-left: auto; min-width: 0; max-width: 170px; font: inherit; color: #57534e; border: 0; background: transparent; text-align: right; cursor: pointer; padding: 4px; border-radius: 6px; }
  .row select:hover { background: #ecebea; }
  .row input { flex: 1; min-width: 0; font: inherit; border: 0; background: transparent; padding: 4px 0; outline: none; }

  .foot { border-top: 1px solid #f0efee; display: flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 14px; font-size: 11.5px; color: #78716c; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #10b981; flex-shrink: 0; }
  .dot.amber { background: #f59e0b; }
  .dot.grey { background: #d6d3d1; }


  .pair { padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 10px; }
  .pair h2 { margin: 0; font-size: 15px; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 500; }
  input { font: inherit; padding: 7px 9px; border: 1px solid #e7e5e4; border-radius: 6px; }
  .note { font-size: 11.5px; color: #78716c; margin: 0; }
  .pair .btn { margin-top: 2px; }
</style>
</head>
<body>
<div class="top">
  <span class="mark">A</span><span class="brand">AILI</span>
  <span id="actions" class="actions hidden">
    <button id="sync" class="icon" aria-label="Sync now" title="Sync now">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.3-4.9L4 8"/><path d="M4 4v4h4"/><path d="M4 13a8 8 0 0 0 14.3 4.9L20 16"/><path d="M20 20v-4h-4"/></svg>
    </button>
    <button id="disconnect" class="icon" aria-label="Disconnect" title="Disconnect from AILI">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 17l5-5-5-5"/><path d="M20 12H9"/><path d="M9 21H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h4"/></svg>
    </button>
  </span>
</div>

<!-- Not paired yet -->
<div id="pair" class="pair hidden">
  <h2>Connect to AILI</h2>
  <label>AILI address <input id="server" type="url" placeholder="http://localhost:3000"></label>
  <label>Helper token <input id="token" type="text" placeholder="aili_..." autocomplete="off"></label>
  <p class="note">Both are in AILI under Settings.</p>
  <button id="connect" class="btn pri">Connect</button>
  <p class="note">Every message is sent only when you click Send in AILI. The helper just carries it. Keep LinkedIn logged in in this browser.</p>
</div>

<!-- On someone's LinkedIn profile -->
<div id="profile" class="hidden">
  <div class="body">
    <div id="p-badge" class="badge ok hidden">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>
    </div>
    <div id="p-av" class="av"></div>
    <div id="p-name" class="name"></div>
    <div id="p-sub" class="sub"></div>
    <div id="p-options" class="group">
      <div class="row"><span>Stage</span><select id="p-stage" aria-label="Stage"></select></div>
      <div class="row"><span>Tag</span><select id="p-tag" aria-label="Tag"><option value="">No tag</option></select></div>
      <div id="p-newtag-row" class="row hidden"><input id="p-newtag" type="text" maxlength="40" placeholder="New tag name" aria-label="New tag name"></div>
    </div>
    <button id="p-add" class="btn pri hidden">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      <span id="p-add-label">Add to AILI</span>
    </button>
    <button id="p-open" class="btn hidden"><span id="p-open-label">Open in AILI</span> <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 5h5v5M19 5l-8 8M18 14v4a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h4"/></svg></button>
    <div id="p-error" class="err hidden"></div>
  </div>
  <div class="foot"><span id="f-dot" class="dot"></span><span id="f-text"></span></div>
</div>

<!-- Anywhere else, or when something needs fixing -->
<div id="state" class="hidden">
  <div class="body">
    <div id="s-ok" class="badge ok">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>
    </div>
    <div id="s-warn" class="badge warn hidden">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 8v5M12 16.5v.5"/><circle cx="12" cy="12" r="9"/></svg>
    </div>
    <div id="s-title" class="name"></div>
    <div id="s-sub" class="sub"></div>
    <button id="s-action" class="btn"></button>
  </div>
</div>

<script src="popup.js" type="module"></script>
</body>
</html>
